<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="28" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- ambient glow -->
  <ellipse cx="320" cy="180" rx="160" ry="120" fill="#22D3EE" opacity="0.05" filter="url(#softglow)"/>

  <!-- symbol: original 140x140 area, scaled to ~240px, centered at 320,180 -->
  <g transform="translate(200, 60) scale(1.7)">
    <g fill="none" stroke="url(#neon)" stroke-width="11" stroke-linecap="round" filter="url(#glow)">
      <circle cx="70" cy="70" r="43"/>
      <line x1="70" y1="58" x2="70" y2="31"/>
      <line x1="59" y1="76" x2="36" y2="90"/>
      <line x1="81" y1="76" x2="104" y2="90"/>
    </g>
    <circle cx="70" cy="70" r="12" fill="#070B16" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
    <path d="M64 30 L70 20 L76 30" fill="none" stroke="#9BEEFF" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
