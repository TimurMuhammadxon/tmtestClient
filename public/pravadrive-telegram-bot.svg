<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#060e1e"/>
    </radialGradient>
    <linearGradient id="wheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- center glow -->
  <ellipse cx="320" cy="180" rx="160" ry="160" fill="#1a4a7a" opacity="0.25" filter="url(#softglow)"/>

  <!-- steering wheel group, centered at 320,180 -->
  <g transform="translate(320,180)" filter="url(#glow)">

    <!-- outer ring -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="url(#wheel)" stroke-width="18"/>

    <!-- top spoke -->
    <line x1="0" y1="-38" x2="0" y2="-88" stroke="url(#wheel)" stroke-width="18" stroke-linecap="round"/>
    <!-- bottom-left spoke -->
    <line x1="-16" y1="22" x2="-76" y2="66" stroke="url(#wheel)" stroke-width="18" stroke-linecap="round"/>
    <!-- bottom-right spoke -->
    <line x1="16" y1="22" x2="76" y2="66" stroke="url(#wheel)" stroke-width="18" stroke-linecap="round"/>

    <!-- center hub -->
    <circle cx="0" cy="0" r="34" fill="#060e1e" stroke="url(#wheel)" stroke-width="12"/>

    <!-- arrow at top -->
    <path d="M-16 -108 L0 -133 L16 -108" fill="none" stroke="#00e5ff" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
