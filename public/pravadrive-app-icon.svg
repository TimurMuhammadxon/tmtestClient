<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A33"/>
      <stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#16335c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#halo)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="3"/>

  <!-- mark, centered & scaled (200 -> ~520, factor 2.6, translate to center) -->
  <g transform="translate(252,232) scale(2.6)">
    <g fill="none" stroke="url(#neon)" stroke-width="11" stroke-linecap="round" filter="url(#glow)">
      <circle cx="100" cy="100" r="62"/>
      <line x1="100" y1="83" x2="100" y2="44"/>
      <line x1="85" y1="109" x2="52" y2="128"/>
      <line x1="115" y1="109" x2="148" y2="128"/>
    </g>
    <circle cx="100" cy="100" r="17" fill="#070B16" stroke="url(#neon)" stroke-width="6" filter="url(#glow)"/>
    <path d="M92 41 L100 29 L108 41" fill="none" stroke="#9BEEFF" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
